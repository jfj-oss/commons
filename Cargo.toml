[workspace]
resolver = "2"
members = ["crates/proto", "crates/relay", "crates/core", "crates/gamekeys", "crates/bot", "app/src-tauri", "app/gpui"]
default-members = ["crates/proto", "crates/relay", "crates/core", "crates/gamekeys", "crates/bot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The calls SDK with mega's three patches (app/gpui/vendor/refresh.sh rebuilds these from crates.io; CALLS-PLAN.md
# section 3). Only mega-gpui depends on them.
[patch.crates-io]
livekit = { path = "app/gpui/vendor/livekit" }
libwebrtc = { path = "app/gpui/vendor/libwebrtc" }
webrtc-sys = { path = "app/gpui/vendor/webrtc-sys" }

[profile.release]
lto = "thin"
codegen-units = 8

# crypto and sqlite are painfully slow unoptimized; keep our own crates debuggable
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2
