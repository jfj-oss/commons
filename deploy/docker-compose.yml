# Unused template. See docs/DEPLOY.md.
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - relay-data:/data
    environment:
      COMMONS_RELAY_INVITE: ${COMMONS_RELAY_INVITE:-}   # set in .env: new accounts then need this secret
    expose:
      - "8787"          # internal only, never published
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COMMONS_DOMAIN: ${COMMONS_DOMAIN:?set COMMONS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [relay]
volumes:
  relay-data:
  caddy-data:
  caddy-config:
