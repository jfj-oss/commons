[package]
name = "commons-gamekeys"
version.workspace = true
edition.workspace = true
publish = false
description = "Per-game push-to-mute: which keys and programs matter, and passive ways of seeing them"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
