[package]
name = "commons-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
commons-proto = { path = "../proto" }
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
crypto_box = { version = "0.9", features = ["seal"] }
ureq = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
minisign-verify = "0.3"
tar = "0.4"
flate2 = "1"

# Game keys read a desktop's keyboard state. Phones have no such thing, and the crate has no mobile backend.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
commons-gamekeys = { path = "../gamekeys" }
# OS notifications from the background part (notify.rs): freedesktop over zbus on Linux (pure Rust, no libdbus), Notification Center on macOS, toasts on Windows.
notify-rust = { version = "4", default-features = false, features = ["z"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
devbridge = []
# Hooks that let the integration tests act as a misbehaving client. Never enabled in a normal build.
test-hooks = []

[[bin]]
name = "dev_bridge"
path = "src/bin/dev_bridge.rs"
required-features = ["devbridge"]

# The Windows and macOS browser versions' launcher (crates/core/src/bin/megatron_launcher.rs).
[[bin]]
name = "megatron_launcher"
path = "src/bin/megatron_launcher.rs"

[dev-dependencies]
commons-core = { path = ".", features = ["test-hooks"] }
# Only the throwaway test signer (examples/minisign-test-sign.rs) and the browser-update tests need it.
blake2 = "0.10"
ureq = "2"
commons-relay = { path = "../relay" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
jsonwebtoken = "9"
rusqlite = { version = "0.37", features = ["bundled"] }
