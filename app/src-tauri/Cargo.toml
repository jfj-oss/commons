[package]
name = "commons-app"
version = "0.2.1"
edition = "2021"
publish = false
description = "Commons: private end-to-end encrypted group chat (desktop)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
commons-core = { path = "../../crates/core" }
serde_json = "1"
# Pinned to a minor version: configure_client hands us its reqwest builder (redirects are switched off there).
tauri-plugin-updater = "~2.14"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
