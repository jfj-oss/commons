[package]
name = "mega-gpui"
version = "0.0.1"
edition = "2021"
publish = false
description = "mega desktop on GPUI (spike; not part of any release)"

[features]
default = ["calls"]
# Calls inside the app. Off, the rest of the app builds without libwebrtc.
calls = ["dep:livekit", "dep:libwebrtc", "dep:webrtc-sys", "dep:tokio", "dep:parking_lot", "dep:getrandom", "dep:serde", "dep:log", "dep:zbus", "dep:libc", "dep:zune-jpeg"]

[lib]
name = "mega_gpui"
path = "src/lib.rs"

[[bin]]
name = "mega-gpui"
path = "src/main.rs"

[dependencies]
commons-core = { path = "../../crates/core" }
commons-gamekeys = { path = "../../crates/gamekeys" }
serde_json = "1"
# the updater (src/update.rs): the same download, archive and signature crates the core already uses
ureq = "2"
flate2 = "1"
tar = "0.4"
# GPUI pinned exactly: see SPIKE.md ("GPUI version"). gpui-kit 0.9.1 pins gpui-pre =0.3.12 (the crates.io snapshot of
# zed's gpui), its platform crate and gpui-component; the workspace Cargo.lock holds every checksum.
gpui-kit = "=0.9.1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Calls (CALLS-PLAN.md). Pinned exactly: an upgrade re-runs tools/gpui-call-interop.mjs first. livekit, libwebrtc and
# webrtc-sys are crates.io sources with three small patches (app/gpui/vendor, wired in the workspace's [patch.crates-io]);
# libwebrtc itself is the prebuilt m150 archive webrtc-sys downloads, unchanged. The LiveKit crates are Apache-2.0;
# libwebrtc is BSD-3-Clause with third-party notices: licenses/libwebrtc-m150-a545de4.md (from that archive) ships with the app.
livekit = { version = "=0.11.0", features = ["rustls-tls-native-roots", "glib-main-loop"], optional = true }
libwebrtc = { version = "=0.4.1", optional = true }
webrtc-sys = { version = "=0.3.54", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std"], optional = true }
base64 = "0.22"
parking_lot = { version = "0.12", optional = true }
getrandom = { version = "0.2", optional = true }
# remote video drawn as images on Linux (videobench.rs now, calls/video.rs later): the versions GPUI already uses
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
smallvec = "1"
# reads the glyph outlines of the room name that runs upward on the call card (vtext.rs); already in the lock file through gpui
ttf-parser = "=0.25.1"
serde = { version = "1", features = ["derive"], optional = true }
log = { version = "0.4", optional = true }
# The camera (calls/camera_linux.rs): V4L2 by hand and the JPEG decoder `image` already builds (same versions as Cargo.lock).
libc = { version = "0.2", optional = true }
zune-jpeg = { version = "=0.5.15", optional = true }

# Global push-to-talk through the desktop portal (calls/shortcuts.rs). The exact version the workspace already builds
# (gpui's own D-Bus code uses it), default features, so no other crate in Cargo.lock changes.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", optional = true }

# macOS notifications with a click that opens the room (macnotify.rs): the versions Cargo.lock already holds (gpui's own).
[target.'cfg(target_os = "ios")'.dependencies]
# The iPhone build (src/ios.rs, IPHONE.md): longbridge's gpui-mobile, vendored and moved to gpui-pre 0.3.12
# camera and video_player: its platform views do not build without them
gpui-mobile = { package = "gpui-pre-mobile", path = "vendor/gpui-mobile", default-features = false, features = ["camera", "video_player"] }
objc2 = "=0.6.5"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-user-notifications = "=0.3.2"
block2 = "=0.6.2"

# CALLS-PLAN.md step 0: a Rust participant driven by tools/gpui-call-interop.mjs.
[[example]]
name = "call_probe"
required-features = ["calls"]

# examples/fakekeys.rs only: real key, pointer and wheel events for a window inside a private headless KWin (SPIKE.md).
[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
# update.rs tests: a throwaway signing key made in the test (never the real one), as crates/core/src/browser_update.rs does
ed25519-dalek = "2"
blake2 = "0.10"
base64 = "0.22"
minisign-verify = "0.3"

[[example]]
name = "audio_probe"
required-features = ["calls"]
