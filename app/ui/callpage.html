<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Megatron call</title>
<style>
:root { --page:#f7f1e4; --card:#fffbf1; --ink:#2a251c; --ink-2:#5a5142; --ink-3:#6c6250; --line:#e3d9c4; --line-2:#cdbfa4; --hover:rgba(116,92,44,.07); --accent:#1f5c4e; --accent-ink:#fffbf1; --hot:#b93a1f; --hot-soft:#fbe4d8; --brass-soft:#f6e8c6; --ok:#24704f; --ok-soft:#dcecdf; --sealed:#a63b26; --shadow:0 12px 34px -8px rgba(60,44,20,.28); --display:Georgia,serif; --sans:system-ui,sans-serif; --mono:ui-monospace,monospace; --ease:cubic-bezier(.22,.8,.3,1);
  --rail:#1d3b34; --rail-2:#274a41; --rail-line:rgba(241,233,216,.13); --rail-ink:#f1e9d8; --rail-mute:#afc2b6; --pill:#e6bb62; }
@media (prefers-color-scheme: dark) { :root { --page:#1f1a15; --card:#2a241d; --ink:#efe6d5; --ink-2:#bdb19c; --ink-3:#9a8e78; --line:#372f27; --line-2:#4b4136; --hover:rgba(240,215,165,.05); --accent:#79c7ab; --accent-ink:#0e1f19; --hot:#ff9472; --hot-soft:#452719; --brass-soft:#3f3220; --ok:#86cfa9; --ok-soft:#22382c; --sealed:#f0917a; --shadow:0 16px 40px -8px rgba(0,0,0,.6); } }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 var(--sans); }
[hidden] { display: none !important; }
.ic { width: 18px; height: 18px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: var(--accent-ink); border: 1px solid transparent; border-radius: 10px; padding: 7px 13px; font-weight: 650; font-size: 13.5px; cursor: pointer; }
.btn.ghost { background: none; color: var(--ink); border-color: var(--line-2); } .btn.danger { background: var(--sealed); color: var(--card); }
.mini { background: none; border: 0; color: inherit; cursor: pointer; font-size: 18px; } .muted { color: var(--ink-3); } .small { font-size: 12.5px; } .grow { flex: 1; }
#lead { max-width: 900px; margin: 0 auto; padding: 10px 14px; }
body { padding-bottom: 96px; }   /* room for the dock, fixed at the bottom of this tab */
</style><link rel="stylesheet" href="call.css"></head>
<body><div id="lead" class="small muted">Megatron call, opened from the desktop app. This tab holds the call's keys for this room only; close it to leave. It talks only to the app on this computer.</div>
<div class="head-actions" hidden></div>
<script src="vendor/livekit-client.umd.js"></script><script src="mic-gate.js"></script><script src="call.js"></script><script src="callpage.js"></script><script src="call-ui.js"></script>
</body></html>
