<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Megatron</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/literata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="call.css">
<link rel="stylesheet" href="fresco.css">
<script src="fresco-rail-dither.js" defer></script>
</head>
<body>

  <defs>

    <linearGradient id="door-spill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--art-glow)" stop-opacity=".5"/><stop offset="1" stop-color="var(--art-glow)" stop-opacity="0"/></linearGradient>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

    <symbol id="i-smile" viewBox="0 0 20 20"><path d="M16 10.5a6.7 6.7 0 1 1-6.5-7"/><path d="M6.7 11.7c.7 1 1.7 1.5 2.8 1.5s2.1-.5 2.8-1.5M7.2 8.2v.1M11.8 8.2v.1M15.5 2.5v5M13 5h5"/></symbol>

    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2M5.3 5.5l.8 11h7.8l.8-11M8.5 9v4M11.5 9v4"/></symbol>

    <symbol id="i-people" viewBox="0 0 20 20"><circle cx="7.5" cy="7" r="3"/><path d="M2 16.5c.5-3 2.6-4.5 5.5-4.5s5 1.5 5.5 4.5M13 4.2a3 3 0 0 1 0 5.6M15 12.4c1.6.7 2.6 2 3 4.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></symbol>

    <symbol id="i-updown" viewBox="0 0 20 20"><path d="m6.5 8 3.5-3.5L13.5 8M6.5 12l3.5 3.5 3.5-3.5"/></symbol>
    <symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.8" cy="13.2" r="3.6"/><path d="M9.4 10.6 16.5 3.5M13.2 6.8l2.4 2.4M15.3 4.7l1.9 1.9"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m4 10.5 4 4 8-9"/></symbol>

    <symbol id="i-devices" viewBox="0 0 20 20"><path d="M10.5 12.5H3.8A1.3 1.3 0 0 1 2.5 11.2V5.3A1.3 1.3 0 0 1 3.8 4h9.4a1.3 1.3 0 0 1 1.3 1.3v1M1.5 15.5h9"/><rect x="13" y="8.5" width="5" height="8.5" rx="1.2"/></symbol>
    <symbol id="i-log" viewBox="0 0 20 20"><path d="M6.5 3h8.3c.7 0 1.2.5 1.2 1.2v11.6c0 .7-.5 1.2-1.2 1.2H6.5M6.5 3C5 3 4 3.8 4 5v10c0 1.2 1 2 2.5 2M6.5 3v14M9.5 7h3.5M9.5 10.3h3.5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 20 20"><path d="M3 5.5h14M3 10h14M3 14.5h9"/></symbol>
    <symbol id="i-x" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></symbol>

    <symbol id="i-door" viewBox="0 0 20 20"><path d="M12 3.5H5.2c-.4 0-.7.3-.7.7v11.6c0 .4.3.7.7.7H12M9 10h8.5M14.5 7l3 3-3 3"/></symbol>
    <symbol id="i-down" viewBox="0 0 20 20"><path d="M10 4v12M5 11l5 5 5-5"/></symbol>
    <symbol id="i-file" viewBox="0 0 20 20"><path d="M5.5 2.5h6L15.5 6.5v11h-10zM11.5 2.5v4h4"/></symbol>
    <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 3v9.5M6 8.5l4 4 4-4M4 16.5h12"/></symbol>
    <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 9.5v4M10 6.5v.1"/></symbol>
    <symbol id="i-warn" viewBox="0 0 20 20"><path d="M10 3.2 2.5 16.5h15zM10 8.5v3.5M10 14.2v.1"/></symbol>
    <symbol id="i-sync" viewBox="0 0 20 20"><path d="M16 8.2A6.2 6.2 0 0 0 4.8 6.5L3.5 8M4 11.8a6.2 6.2 0 0 0 11.2 1.7L16.5 12M3.5 4v4h4M16.5 16v-4h-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/></symbol>
    <!-- A small voice-in-progress mark beside a room with people in its call. -->
    <symbol id="i-wave" viewBox="0 0 20 20"><path d="M3 10v0M6 7v6M9 4.5v11M12 7v6M15 8.5v3M18 10v0"/></symbol>
  </g>
  <!-- The keyhole beside each room. -->
  <symbol id="i-keyhole" viewBox="0 0 12 14"><path fill="currentColor" d="M6 .8a3.7 3.7 0 0 1 1.8 6.9l.9 5a.6.6 0 0 1-.6.7H3.9a.6.6 0 0 1-.6-.7l.9-5A3.7 3.7 0 0 1 6 .8z"/></symbol>
  <!-- A club crest: a soft shield with an inner rule. -->
  <symbol id="crest" viewBox="0 0 40 46"><path fill="var(--wax)" d="M20 1.5c5 3 11 4 17 4 .8 0 1.5.7 1.5 1.5v15c0 11-7.5 18.5-17.8 22.3a2 2 0 0 1-1.4 0C9 40.5 1.5 33 1.5 22V7c0-.8.7-1.5 1.5-1.5 6 0 12-1 17-4z"/><path fill="none" stroke="var(--crest-rule, rgba(255,240,205,.5))" stroke-width="1" d="M20 5c4.5 2.5 10 3.5 15 3.7V22c0 9-6 15.5-15 19-9-3.5-15-10-15-19V8.7c5-.2 10.5-1.2 15-3.7z"/></symbol>
  <!-- Empty-state art. -->
  <symbol id="art-table" viewBox="0 0 320 190">
    <path fill="url(#lamp-cone)" d="M139 58 62 158h196L181 58z"/>
    <g fill="none" stroke="var(--art-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 0v26"/>
      <path d="M36 112v78M36 158h30M66 158v32"/>
      <path d="M284 112v78M284 158h-30M254 158v32"/>
      <path d="M84 158l-9 32M236 158l9 32"/>
      <path d="M118 140h20v5a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6zM138 142h3a3 3 0 0 1 0 6h-3.5"/>
      <path d="M124 134c0-3 3-3 3-6M131 134c0-3 3-3 3-6"/>
      <path d="M170 151c8-5 16-5 22 0 6-5 14-5 22 0M192 151v-8c-6-4-14-4-22 0v8M192 143c6-4 14-4 22 0v8"/>
    </g>
    <path fill="var(--art-brass)" d="M136 60c3-20 14-34 24-34s21 14 24 34z"/>
    <path fill="var(--art-glow)" d="M151 60a9 6 0 0 0 18 0z"/>
    <rect x="52" y="151" width="216" height="7" rx="3.5" fill="var(--art-line)"/>
  </symbol>
  <symbol id="art-door" viewBox="0 0 320 190">
    <path fill="url(#door-spill)" d="M122 188h82l52 2H78z"/>
    <path fill="var(--art-glow)" opacity=".85" d="M122 26h82v162h-82z"/>
    <path fill="var(--art-panel)" stroke="var(--art-line)" stroke-width="2" stroke-linejoin="round" d="M204 26l42 15v164l-42-17z"/>
    <path fill="none" stroke="var(--art-line)" stroke-width="2" stroke-linejoin="round" d="M213 52l24 9v44l-24-7zM213 118l24 7v44l-24-8z"/>
    <circle cx="215" cy="108" r="2.600" fill="var(--art-brass)"/>
    <path fill="none" stroke="var(--art-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M122 188V26h82M40 188h240"/>
    <path fill="none" stroke="var(--art-line)" stroke-width="2" stroke-linecap="round" d="M92 62v-9c0-3 2.5-5 5-5"/>
    <path fill="var(--art-brass)" d="M84 76a8 14 0 0 1 16 0z"/>
  </symbol>
  <symbol id="art-wait" viewBox="0 0 320 190">
    <path fill="var(--art-panel)" stroke="var(--art-line)" stroke-width="2" stroke-linejoin="round" d="M118 188V30a4 4 0 0 1 4-4h76a4 4 0 0 1 4 4v158z"/>
    <path fill="var(--art-glow)" stroke="var(--art-line)" stroke-width="2" d="M136 74V60a24 24 0 0 1 48 0v14z"/>
    <path fill="none" stroke="var(--art-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M160 36v38M136 58h48M134 92h52v76h-52zM40 188h240"/>
    <circle cx="192" cy="118" r="3" fill="var(--art-brass)"/>
    <path fill="var(--art-brass)" opacity=".85" d="M112 186h96l12 4H100z"/>
    <path fill="none" stroke="var(--art-line)" stroke-width="2" stroke-linecap="round" d="M232 188v-18M232 170c-9 0-14-5-14-13 9 0 14 5 14 13zM232 176c7 0 11-4 11-10-7 0-11 4-11 10z"/>
  </symbol>
</svg>
<div id="boot" hidden></div>
<div id="app" hidden>
  <div id="rail-scrim"></div>
  <aside id="rail" aria-label="Rooms">
    <button id="switcher" class="switcher" title="Switch community" aria-haspopup="menu"><span id="sw-crest" class="crest-slot"></span><span class="sw-text"><span id="sw-name">—</span><span id="sw-sub"></span></span><svg class="ic chev"><use href="#i-updown"/></svg></button>
    <div id="sw-menu" class="menu" role="menu" hidden></div>
    <div class="rail-label"><span>Rooms</span><button id="add-room" class="mini" title="New room" aria-label="New room" hidden><svg class="ic"><use href="#i-plus"/></svg></button></div>
    <nav id="rooms"></nav>
    <div class="grow"></div>
    <div id="sync-status" class="sync"></div>
    <div class="me">
      <span id="me-seal" class="me-seal"></span>
      <div class="me-text"><div id="me-name"></div><div class="small" id="me-sub"></div></div>
      <button id="btn-devices" class="mini" title="Devices and recovery" aria-label="Devices and recovery"><svg class="ic"><use href="#i-devices"/></svg></button>
      <button id="btn-activity" class="mini" title="Activity log" aria-label="Activity log"><svg class="ic"><use href="#i-log"/></svg><span id="activity-dot" hidden></span></button>
      <button id="btn-settings" class="mini" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
    </div>
  </aside>
  <main id="main">
    <div id="lamp" aria-hidden="true"></div>
    <header id="head">
      <button id="btn-rooms" class="mini" title="Rooms" aria-label="Rooms"><svg class="ic"><use href="#i-menu"/></svg><span id="rooms-dot" hidden></span></button>
      <div class="head-title"><h1 id="chan-title">Welcome</h1><div id="chan-sub"></div></div>
      <div class="head-actions">
        <div class="search-wrap">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search this device" aria-label="Search messages on this device" autocomplete="off">
          <div id="search-pop" hidden></div>
        </div>
        <button id="btn-search" class="mini" title="Search" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
        <button id="btn-invite" class="btn" hidden><svg class="ic"><use href="#i-key"/></svg><span>Invite</span></button>
        <button id="btn-people" class="btn ghost" aria-label="People"><span id="people-stack" class="stack"></span><svg class="ic"><use href="#i-people"/></svg><span class="lbl">People</span></button>
      </div>
    </header>
    <div id="banner" hidden></div>
    <div id="upd" hidden></div>
    <div id="stream-wrap">
      <section id="stream" aria-live="polite" aria-relevant="additions"><div id="empty" class="empty"></div></section>
      <div id="day-float" aria-hidden="true"></div>
      <button id="jump" hidden><svg class="ic"><use href="#i-down"/></svg><span id="jump-label">Latest</span></button>
    </div>
    <footer id="composer" hidden>
      <div id="mention-pop" class="mention-pop" hidden></div>
      <div class="slip">
        <div id="replybar" class="replybar" hidden></div>
        <div class="row">
          <button id="attach" class="mini" title="Attach a file" aria-label="Attach a file"><svg class="ic"><use href="#i-clip"/></svg></button>
          <input type="file" id="file" hidden>
          <textarea id="input" rows="1" placeholder="Write a message" aria-label="Write a message"></textarea>
          <button id="send" class="btn" title="Send"><svg class="ic"><use href="#i-send"/></svg><span id="send-label">Send</span></button>
        </div>
      </div>
      <div class="foot">
        <div id="typing" class="typing"></div>
        <div id="hint" class="hint"><svg class="ic"><use href="#i-lock"/></svg><span>End-to-end encrypted.</span><span class="more">Shift+Enter for a new line.</span></div>
      </div>
    </footer>
  </main>
  <aside id="people" aria-label="People" hidden></aside>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
<script src="vendor/livekit-client.umd.js"></script>
<script src="mic-gate.js"></script>
<script src="call.js"></script>
<script src="call-ui.js"></script>
<script src="update-ui.js"></script>
</body>
</html>
