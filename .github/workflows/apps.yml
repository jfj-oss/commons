# Builds the desktop apps on GitHub's machines. Runs only when started by hand (Actions tab, or: gh workflow run apps.yml).
# Not run yet: this repository has no remote. The builds are unsigned; docs/FRIENDS.md says what friends then see.
name: apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, bundles: nsis, out: "target/release/bundle/nsis/*-setup.exe", name: Commons-windows-x64-setup.exe }
          - { os: macos-latest, bundles: dmg, out: "target/release/bundle/dmg/*.dmg", name: Commons-macos-arm64.dmg }
          - { os: ubuntu-22.04, bundles: appimage, out: "target/release/bundle/appimage/*.AppImage", name: Commons-linux-x86_64.AppImage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Tests (core, relay)
        run: cargo test -p commons-proto -p commons-core -p commons-relay
        if: runner.os == 'Linux'
      - name: Tauri CLI
        working-directory: tools
        run: npm ci
      - name: Build
        working-directory: app/src-tauri
        shell: bash
        run: ../../tools/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}
      - name: Name it
        shell: bash
        run: mkdir -p out && cp ${{ matrix.out }} "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error

  # The native (GPUI) app for Linux: a stripped tarball with install.sh / uninstall.sh (packaging/linux-native). Runs next to
  # the Tauri builds and replaces nothing. Built on the oldest runner so the glibc it links is old. Not yet run on GitHub.
  native-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake clang libssl-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev libpulse-dev libglib2.0-dev libgbm-dev imagemagick
      - name: Build and pack
        run: scripts/build-linux-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mega-linux-x86_64.tar.gz
          path: dist/mega-linux-x86_64.tar.gz
          if-no-files-found: error
      # the file the app's self-updater swaps itself for. It is NOT signed here: signing is done on the owner's PC with the
      # updater key (scripts/publish-update.sh, docs/UPDATES.md), which never goes to GitHub.
      - uses: actions/upload-artifact@v4
        with:
          name: mega-gpui-linux-x86_64
          path: dist/mega-gpui-linux-x86_64
          if-no-files-found: error

  # The native (GPUI) app for macOS (Apple silicon): mega.app, ad-hoc signed, zipped as mega-macos-arm64.app.tar.gz (the
  # self-updater's file too; unsigned by the updater key here, see above). Needs only Rust and the Xcode command line tools.
  native-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and bundle
        run: scripts/build-mac-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mega-macos-arm64.app.tar.gz
          path: dist/mega-macos-arm64.app.tar.gz
          if-no-files-found: error
