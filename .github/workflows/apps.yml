# Builds the desktop apps on GitHub's machines. Runs only when started by hand (Actions tab, or: gh workflow run apps.yml).
# Not run yet: this repository has no remote. The builds are unsigned; docs/FRIENDS.md says what friends then see.
name: apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, bundles: nsis, out: "target/release/bundle/nsis/*-setup.exe", name: Commons-windows-x64-setup.exe }
          - { os: macos-latest, bundles: dmg, out: "target/release/bundle/dmg/*.dmg", name: Commons-macos-arm64.dmg }
          - { os: ubuntu-22.04, bundles: appimage, out: "target/release/bundle/appimage/*.AppImage", name: Commons-linux-x86_64.AppImage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Tests (core, relay)
        run: cargo test -p commons-proto -p commons-core -p commons-relay
        if: runner.os == 'Linux'
      - name: Tauri CLI
        working-directory: tools
        run: npm ci
      - name: Build
        working-directory: app/src-tauri
        run: ../../tools/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}
      - name: Name it
        shell: bash
        run: mkdir -p out && cp ${{ matrix.out }} "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error
